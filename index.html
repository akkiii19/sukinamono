<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スキナモノ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

  :root{
    --bg: #FAF7F2;
    --card: #FFFFFF;
    --ink: #2B2622;
    --ink-soft: #6E655C;
    --line: #E7DFD3;
    --accent: #C2542F;
    --accent-soft: #F1E1D6;
    --gold: #B8963F;
    --link: #4A7A8C;
    --link-soft: #E3EEF1;
  }
  [data-theme="dark"]{
    --bg: #1C1A18;
    --card: #262320;
    --ink: #F1ECE4;
    --ink-soft: #A79E92;
    --line: #3A352F;
    --accent: #E07A50;
    --accent-soft: #3A2A22;
    --gold: #D6B96A;
    --link: #7FB3C4;
    --link-soft: #22303380;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .2s, color .2s;
  }
  .wrap{max-width:900px;margin:0 auto;padding:32px 20px 80px;}

  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:20px;border-bottom:2px solid var(--ink);padding-bottom:16px;
    gap:12px;
  }
  .title-area{display:flex;align-items:flex-end;gap:12px;}
  h1{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:26px;font-weight:700;margin:0;letter-spacing:.02em;
  }
  .count{font-size:13px;color:var(--ink-soft);}
  .theme-toggle{
    flex:0 0 auto;font-size:13px;cursor:pointer;
    border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;background:var(--card);color:var(--ink-soft);
  }
  .theme-toggle:hover{border-color:var(--ink-soft);color:var(--ink);}

  .tabs{display:flex;gap:6px;margin-bottom:20px;}
  .tab-btn{
    font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    padding:9px 20px;border-radius:999px;
  }
  .tab-btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  .page{display:none;}
  .page.active{display:block;}

  .add-bar{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:24px;
  }
  .add-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .add-row:last-child{margin-bottom:0;}
  input[type=text], input[type=url], select, textarea{
    font-family:inherit;font-size:14px;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:9px 12px;
    background:var(--card);flex:1;min-width:110px;
  }
  textarea{resize:vertical;min-height:38px;width:100%;}
  input:focus, textarea:focus, select:focus{
    outline:none;border-color:var(--accent);
  }
  .name-input{flex:2;min-width:160px;}
  select{flex:0 0 auto;min-width:100px;}
  .btn{
    font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;
    border-radius:8px;border:1px solid var(--ink);background:var(--ink);
    color:var(--bg);padding:9px 18px;white-space:nowrap;
  }
  .btn:hover{opacity:.85;}
  .btn-ghost{
    background:transparent;color:var(--ink-soft);border:1px solid var(--line);
    font-size:12px;padding:5px 10px;border-radius:7px;cursor:pointer;
    font-family:inherit;
  }
  .btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}

  /* カテゴリ入力 + カスタムドロップダウン */
  .combo{position:relative;flex:1;min-width:110px;}
  .combo input{width:100%;}
  .combo-list{
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    max-height:180px;overflow-y:auto;display:none;
    box-shadow:0 6px 16px rgba(0,0,0,.12);
  }
  .combo-list.open{display:block;}
  .combo-list div{padding:8px 12px;font-size:13px;cursor:pointer;color:var(--ink);}
  .combo-list div:hover{background:var(--accent-soft);}
  .combo-arrow{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    font-size:11px;color:var(--ink-soft);cursor:pointer;padding:4px;
  }

  /* リンク入力欄 */
  .link-editor{display:flex;flex-direction:column;gap:6px;}
  .link-row{display:flex;gap:6px;align-items:center;}
  .link-row input{flex:1;min-width:80px;}
  .link-row .link-label-input{flex:0 0 90px;}
  .link-remove{
    flex:0 0 auto;background:transparent;border:none;color:var(--ink-soft);
    cursor:pointer;font-size:16px;padding:2px 6px;
  }
  .link-remove:hover{color:var(--accent);}
  .link-add-btn{
    align-self:flex-start;font-size:12px;color:var(--link);background:transparent;
    border:1px dashed var(--line);border-radius:7px;padding:5px 12px;cursor:pointer;
    font-family:inherit;
  }
  .link-add-btn:hover{border-color:var(--link);}

  /* 一覧側のリンクチップ */
  .link-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .link-chip{
    font-size:12px;color:var(--link);background:var(--link-soft);
    padding:3px 10px;border-radius:999px;text-decoration:none;
    display:inline-flex;align-items:center;gap:3px;
  }
  .link-chip:hover{opacity:.8;}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
  .subfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
  .toolrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px;}
  .sort-select{
    font-family:inherit;font-size:13px;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;
    background:var(--card);flex:0 0 auto;
  }
  .rating-filter{
    position:relative;flex:0 0 auto;
  }
  .rating-filter-btn{
    font-size:13px;padding:6px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink-soft);
  }
  .rating-filter-btn.active{border-color:var(--accent);color:var(--accent);}
  .rating-filter-list{
    position:absolute;top:calc(100% + 4px);left:0;z-index:20;
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;display:none;box-shadow:0 6px 16px rgba(0,0,0,.12);
    white-space:nowrap;
  }
  .rating-filter-list.open{display:block;}
  .rating-filter-list label{
    display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 2px;cursor:pointer;color:var(--ink);
  }
  .chip{
    font-size:13px;padding:6px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink-soft);
  }
  .chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .chip.sub{font-size:12px;padding:5px 12px;}
  .search{margin-left:auto;min-width:160px;}

  .grid{display:flex;flex-direction:column;gap:10px;}
  .item{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;display:flex;gap:12px;align-items:flex-start;
  }
  .item .cat-badges{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;margin-top:2px;}
  .badge{
    font-size:11px;padding:4px 10px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent);font-weight:500;
    white-space:nowrap;text-align:center;
  }
  .badge.sub{background:transparent;border:1px solid var(--line);color:var(--ink-soft);}
  .item .body{flex:1;min-width:0;}
  .item .top-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .item .title{font-size:16px;font-weight:500;}
  .stars{color:var(--gold);font-size:13px;letter-spacing:1px;}
  .item .memo{font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.5;white-space:pre-wrap;}

  /* actions: 上段(操作ボタン) + 下段(日付+削除) の2行構成 */
  .item .actions{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .actions-top{display:flex;gap:6px;}
  .actions-bottom{display:flex;align-items:center;gap:8px;}
  .date-label{font-size:13px;color:var(--ink-soft);white-space:nowrap;}

  .empty{
    text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;
    border:1px dashed var(--line);border-radius:14px;
  }

  .edit-form{flex:1;display:flex;flex-direction:column;gap:8px;}
  .edit-row{display:flex;gap:8px;flex-wrap:wrap;}
  .edit-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  .btn-save{
    font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;
    border-radius:7px;border:1px solid var(--ink);background:var(--ink);
    color:var(--bg);padding:6px 14px;
  }
  .btn-cancel{
    font-family:inherit;font-size:13px;cursor:pointer;
    border-radius:7px;border:1px solid var(--line);background:transparent;
    color:var(--ink-soft);padding:6px 14px;
  }
  .btn-promote{
    font-family:inherit;font-size:12px;cursor:pointer;
    border-radius:7px;border:1px solid var(--accent);background:transparent;
    color:var(--accent);padding:5px 10px;
  }
  .btn-promote:hover{background:var(--accent-soft);}

  @media (max-width:520px){
    h1{font-size:20px;}
    .item{flex-wrap:wrap;}
    .item .cat-badges{order:2;flex-direction:row;}
    .item .body{order:1;flex-basis:100%;}
    .item .actions{order:3;width:100%;align-items:stretch;}
    .actions-top{justify-content:flex-end;}
    .actions-bottom{justify-content:space-between;}
  }

  /* ---------- ログイン画面 ---------- */
  #loginScreen{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;text-align:center;padding:20px;
  }
  #loginScreen h1{font-size:30px;}
  #loginScreen p{color:var(--ink-soft);font-size:14px;margin:0;}
  .google-btn{
    display:inline-flex;align-items:center;gap:10px;
    font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:11px 22px;border-radius:999px;
  }
  .google-btn:hover{border-color:var(--ink-soft);}
  .google-btn svg{width:18px;height:18px;}
  #loginError{color:var(--accent);font-size:13px;display:none;}

  #appScreen{display:none;}
  .user-badge{
    display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);
  }
  .user-badge img{width:24px;height:24px;border-radius:50%;}
  .logout-btn{
    font-family:inherit;font-size:12px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);
    padding:5px 12px;border-radius:999px;
  }
  .logout-btn:hover{border-color:var(--ink-soft);color:var(--ink);}
  .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}

  #syncStatus{font-size:11px;color:var(--ink-soft);}
</style>
</head>
<body>

<!-- ===================== ログイン画面 ===================== -->
<div id="loginScreen">
  <h1>スキナモノ</h1>
  <p>好きなもの・気になるものを記録するアプリです。<br>Googleアカウントでログインしてください。</p>
  <button class="google-btn" id="googleLoginBtn">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6.1 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.4l-6.5-5.5C29.4 34.7 26.8 36 24 36c-5.2 0-9.6-3.1-11.3-7.5l-6.6 5.1C9.6 39.7 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.5-2.6 4.6-4.8 6.1l6.5 5.5C40.9 36.6 44 30.9 44 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
    Googleでログイン
  </button>
  <p id="loginError">ログインに失敗しました。もう一度お試しください。</p>
</div>

<!-- ===================== アプリ本体 ===================== -->
<div id="appScreen">
<div class="wrap">

  <header>
    <div class="title-area">
      <h1>スキナモノ</h1>
      <span class="count" id="countLabel">0件</span>
    </div>
    <div class="header-right">
      <span id="syncStatus"></span>
      <div class="user-badge">
        <img id="userAvatar" src="" alt="">
        <span id="userName"></span>
      </div>
      <button class="theme-toggle" id="themeToggle">ダークモード</button>
      <button class="logout-btn" id="logoutBtn">ログアウト</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-page="fav">スキナモノ</button>
    <button class="tab-btn" data-page="curious">キニナルモノ</button>
  </div>

  <!-- ===================== スキナモノ ===================== -->
  <div class="page active" id="page-fav">
    <div class="add-bar">
      <div class="add-row">
        <div class="combo" id="catCombo">
          <input type="text" id="catInput" placeholder="大カテゴリ(例: アニメ)" autocomplete="off">
          <span class="combo-arrow" id="catArrow">▼</span>
          <div class="combo-list" id="catComboList"></div>
        </div>
        <div class="combo" id="subCatCombo">
          <input type="text" id="subCatInput" placeholder="中カテゴリ(任意)" autocomplete="off">
          <span class="combo-arrow" id="subCatArrow">▼</span>
          <div class="combo-list" id="subCatComboList"></div>
        </div>
      </div>
      <div class="add-row">
        <input type="text" id="nameInput" class="name-input" placeholder="名前(例: 千と千尋の神隠し)">
        <select id="ratingInput">
          <option value="0">評価なし</option>
          <option value="1">★</option>
          <option value="2">★★</option>
          <option value="3">★★★</option>
          <option value="4">★★★★</option>
          <option value="5">★★★★★</option>
        </select>
      </div>
      <div class="add-row">
        <textarea id="memoInput" placeholder="メモ(好きな理由、関連作品、行った時の感想など)"></textarea>
      </div>
      <div class="add-row">
        <div class="link-editor" id="linkEditorAdd">
          <button class="link-add-btn" id="linkAddBtnAdd" type="button">+ リンクを追加</button>
        </div>
      </div>
      <div class="add-row" style="justify-content:flex-end;">
        <button class="btn" id="addBtn">追加する</button>
      </div>
    </div>

    <div class="filters" id="filters">
      <span class="chip active" data-cat="すべて">すべて</span>
    </div>
    <div class="subfilters" id="subfilters" style="display:none;"></div>
    <div class="toolrow">
      <select class="sort-select" id="sortSelect">
        <option value="rating_desc">評価が高い順</option>
        <option value="rating_asc">評価が低い順</option>
        <option value="date_desc">登録日が新しい順</option>
        <option value="date_asc">登録日が古い順</option>
        <option value="name_asc">名前順</option>
      </select>
      <div class="rating-filter" id="ratingFilter">
        <button type="button" class="rating-filter-btn" id="ratingFilterBtn">評価で絞り込み</button>
        <div class="rating-filter-list" id="ratingFilterList">
          <label><input type="checkbox" class="rf-check" value="0" checked>評価なし</label>
          <label><input type="checkbox" class="rf-check" value="1" checked>★</label>
          <label><input type="checkbox" class="rf-check" value="2" checked>★★</label>
          <label><input type="checkbox" class="rf-check" value="3" checked>★★★</label>
          <label><input type="checkbox" class="rf-check" value="4" checked>★★★★</label>
          <label><input type="checkbox" class="rf-check" value="5" checked>★★★★★</label>
        </div>
      </div>
      <input type="text" class="search" id="searchInput" placeholder="検索...">
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="emptyState" style="display:none;">まだ何も登録されていません。上のフォームから追加してみましょう。</div>
  </div>

  <!-- ===================== キニナルモノ ===================== -->
  <div class="page" id="page-curious">
    <div class="add-bar">
      <div class="add-row">
        <div class="combo" id="curCatCombo">
          <input type="text" id="curCatInput" placeholder="カテゴリ(例: アニメ)" autocomplete="off">
          <span class="combo-arrow" id="curCatArrow">▼</span>
          <div class="combo-list" id="curCatComboList"></div>
        </div>
        <input type="text" id="curNameInput" class="name-input" placeholder="名前">
        <select id="curRatingInput">
          <option value="0">関心度なし</option>
          <option value="1">★</option>
          <option value="2">★★</option>
          <option value="3">★★★</option>
          <option value="4">★★★★</option>
          <option value="5">★★★★★</option>
        </select>
      </div>
      <div class="add-row">
        <textarea id="curMemoInput" placeholder="メモ(気になっている理由など)"></textarea>
      </div>
      <div class="add-row">
        <div class="link-editor" id="linkEditorCurAdd">
          <button class="link-add-btn" id="linkAddBtnCurAdd" type="button">+ リンクを追加</button>
        </div>
      </div>
      <div class="add-row" style="justify-content:flex-end;">
        <button class="btn" id="curAddBtn">追加する</button>
      </div>
    </div>

    <div class="filters" id="curFilters">
      <span class="chip active" data-cat="すべて">すべて</span>
    </div>
    <div class="toolrow">
      <select class="sort-select" id="curSortSelect">
        <option value="rating_desc">関心度が高い順</option>
        <option value="rating_asc">関心度が低い順</option>
        <option value="date_desc">登録日が新しい順</option>
        <option value="date_asc">登録日が古い順</option>
        <option value="name_asc">名前順</option>
      </select>
      <div class="rating-filter" id="curRatingFilter">
        <button type="button" class="rating-filter-btn" id="curRatingFilterBtn">関心度で絞り込み</button>
        <div class="rating-filter-list" id="curRatingFilterList">
          <label><input type="checkbox" class="crf-check" value="0" checked>関心度なし</label>
          <label><input type="checkbox" class="crf-check" value="1" checked>★</label>
          <label><input type="checkbox" class="crf-check" value="2" checked>★★</label>
          <label><input type="checkbox" class="crf-check" value="3" checked>★★★</label>
          <label><input type="checkbox" class="crf-check" value="4" checked>★★★★</label>
          <label><input type="checkbox" class="crf-check" value="5" checked>★★★★★</label>
        </div>
      </div>
      <input type="text" class="search" id="curSearchInput" placeholder="検索...">
    </div>

    <div class="grid" id="curGrid"></div>
    <div class="empty" id="curEmptyState" style="display:none;">まだ何も登録されていません。上のフォームから追加してみましょう。</div>
  </div>

</div>
</div><!-- /#appScreen -->

<!-- Firebase SDK (v10, モジュール形式) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBO7ub042Io7-4tLu9bN36qsN6RV7ZDYFo",
    authDomain: "mylist-a19.firebaseapp.com",
    projectId: "mylist-a19",
    storageBucket: "mylist-a19.firebasestorage.app",
    messagingSenderId: "473688783782",
    appId: "1:473688783782:web:78e6d40e6710632299ed67"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // window経由でメインスクリプトから使えるように公開
  window.__firebase = { auth, db, doc, getDoc, setDoc };

  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('appScreen');
  const loginError = document.getElementById('loginError');

  document.getElementById('googleLoginBtn').addEventListener('click', async ()=>{
    loginError.style.display = 'none';
    try{
      await signInWithPopup(auth, provider);
    }catch(e){
      console.error('ログインエラー', e);
      loginError.style.display = 'block';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    await signOut(auth);
  });

  onAuthStateChanged(auth, (user)=>{
    if(user){
      loginScreen.style.display = 'none';
      appScreen.style.display = 'block';
      document.getElementById('userAvatar').src = user.photoURL || '';
      document.getElementById('userName').textContent = user.displayName || user.email || '';
      window.__onLogin && window.__onLogin(user);
    }else{
      loginScreen.style.display = 'flex';
      appScreen.style.display = 'none';
    }
  });
</script>

<script>
/* ============================================================
   共通
============================================================ */
const THEME_KEY = 'theme';
const FAV_KEY = 'favorites';
const CUR_KEY = 'curious';

/* ============================================================
   Firestore ラッパー
   ユーザーごとに users/{uid} ドキュメント1件に
   { theme, favorites, curious } を保存する。
   既存コードの window.storage.get/set 呼び出しをそのまま使えるように、
   同じインターフェースの薄いラッパーをここで用意する。
============================================================ */
let currentUid = null;
let userDocCache = null; // Firestoreから読んだ最新のドキュメント内容をキャッシュ

async function ensureUserDoc(){
  const { db, doc, getDoc } = window.__firebase;
  const ref = doc(db, 'users', currentUid);
  const snap = await getDoc(ref);
  userDocCache = snap.exists() ? snap.data() : {};
  return ref;
}

const storage = {
  async get(key){
    if(!currentUid) return null;
    if(userDocCache === null){ await ensureUserDoc(); }
    if(!(key in userDocCache) || userDocCache[key] === undefined){
      return null;
    }
    return { key, value: userDocCache[key], shared: false };
  },
  async set(key, value){
    if(!currentUid) return null;
    const { db, doc, setDoc } = window.__firebase;
    const ref = doc(db, 'users', currentUid);
    userDocCache = userDocCache || {};
    userDocCache[key] = value;
    setSyncStatus('保存中…');
    try{
      await setDoc(ref, { [key]: value }, { merge: true });
      setSyncStatus('保存済み');
    }catch(e){
      console.error('Firestore保存エラー', e);
      setSyncStatus('保存に失敗しました');
      throw e;
    }
    return { key, value, shared: false };
  }
};
window.storage = storage;

function setSyncStatus(text){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = text;
  if(text === '保存済み'){
    setTimeout(()=>{ if(el && el.textContent === '保存済み') el.textContent=''; }, 1500);
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function formatDate(ts){
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}/${m}/${day}`;
}
function normalizeUrl(u){
  u = u.trim();
  if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}
function renderLinkChips(links){
  if(!links || links.length === 0) return '';
  return `<div class="link-chips">${
    links.map(l=>`<a class="link-chip" href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(l.label || 'リンク')} ↗</a>`).join('')
  }</div>`;
}

/* ---------- 名前の並び替え: 記号 > 数字 > アルファベット > ひらがな・カタカナ > 漢字 ---------- */
function charRank(ch){
  const code = ch.codePointAt(0);
  // 数字 0-9
  if(ch >= '0' && ch <= '9') return 1;
  // アルファベット A-Z a-z (大文字小文字は同ランクで比較時に区別)
  if((ch >= 'A' && ch <= 'Z') || (ch >= 'a' && ch <= 'z')) return 2;
  // ひらがな・カタカナ
  if((code >= 0x3040 && code <= 0x309F) || (code >= 0x30A0 && code <= 0x30FF)) return 3;
  // 漢字(CJK統合漢字)
  if(code >= 0x4E00 && code <= 0x9FFF) return 4;
  // それ以外(記号・その他)は最優先
  return 0;
}
function compareNames(a, b){
  const sa = (a || '');
  const sb = (b || '');
  const len = Math.max(sa.length, sb.length);
  for(let i = 0; i < len; i++){
    const ca = sa[i], cb = sb[i];
    if(ca === undefined) return -1;
    if(cb === undefined) return 1;
    const ra = charRank(ca), rb = charRank(cb);
    if(ra !== rb) return ra - rb;
    if(ca !== cb) return ca < cb ? -1 : 1;
  }
  return 0;
}
function sortItems(list, sortKey){
  const arr = list.slice();
  switch(sortKey){
    case 'rating_desc':
      arr.sort((a,b)=> (b.rating||0) - (a.rating||0) || (b.createdAt||0) - (a.createdAt||0));
      break;
    case 'rating_asc':
      arr.sort((a,b)=> (a.rating||0) - (b.rating||0) || (b.createdAt||0) - (a.createdAt||0));
      break;
    case 'date_desc':
      arr.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
      break;
    case 'date_asc':
      arr.sort((a,b)=> (a.createdAt||0) - (b.createdAt||0));
      break;
    case 'name_asc':
      arr.sort((a,b)=> compareNames(a.name, b.name));
      break;
    default:
      arr.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  }
  return arr;
}

/* ---------- 評価フィルターのドロップダウン開閉共通処理 ---------- */
function setupRatingFilter(btnId, listId, onChange){
  const btn = document.getElementById(btnId);
  const list = document.getElementById(listId);
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    list.classList.toggle('open');
  });
  document.addEventListener('click', (e)=>{
    if(!btn.contains(e.target) && !list.contains(e.target)){ list.classList.remove('open'); }
  });
  list.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', onChange);
  });
}
function getCheckedRatings(listId){
  const list = document.getElementById(listId);
  return Array.from(list.querySelectorAll('input[type=checkbox]:checked')).map(cb=>parseInt(cb.value));
}
function updateRatingFilterBtnState(btnId, listId){
  const total = document.getElementById(listId).querySelectorAll('input[type=checkbox]').length;
  const checked = getCheckedRatings(listId).length;
  document.getElementById(btnId).classList.toggle('active', checked < total);
}

/* ---------- テーマ ---------- */
async function loadTheme(){
  try{
    const res = await window.storage.get(THEME_KEY);
    applyTheme(res ? res.value : 'light');
  }catch(e){ applyTheme('light'); }
}
function applyTheme(theme){
  if(theme === 'dark'){
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeToggle').textContent = 'ライトモード';
  }else{
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('themeToggle').textContent = 'ダークモード';
  }
}
document.getElementById('themeToggle').addEventListener('click', async ()=>{
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  applyTheme(newTheme);
  try{ await window.storage.set(THEME_KEY, newTheme); }catch(e){ console.error('テーマの保存に失敗しました', e); }
});

/* ---------- タブ切り替え ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
  });
});

/* ---------- カスタムコンボボックス ---------- */
function setupCombo(inputId, arrowId, listId, getOptions){
  const input = document.getElementById(inputId);
  const arrow = document.getElementById(arrowId);
  const list = document.getElementById(listId);

  function renderList(){
    const opts = getOptions();
    if(opts.length === 0){ list.classList.remove('open'); list.innerHTML=''; return; }
    list.innerHTML = opts.map(o=>`<div data-val="${escapeHtml(o)}">${escapeHtml(o)}</div>`).join('');
    list.classList.add('open');
  }
  function closeList(){ list.classList.remove('open'); }

  arrow.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(list.classList.contains('open')){ closeList(); } else { renderList(); }
  });
  input.addEventListener('focus', renderList);
  input.addEventListener('input', renderList);
  list.addEventListener('click', (e)=>{
    const opt = e.target.closest('[data-val]');
    if(!opt) return;
    input.value = opt.dataset.val;
    closeList();
    input.dispatchEvent(new Event('change'));
  });
  document.addEventListener('click', (e)=>{
    if(!input.contains(e.target) && !arrow.contains(e.target) && !list.contains(e.target)){ closeList(); }
  });
  return { renderList, closeList };
}

/* ---------- リンク編集UI(追加フォーム用の汎用ビルダー) ---------- */
function createLinkEditor(containerId, addBtnId){
  let links = []; // {label, url}
  const container = document.getElementById(containerId);
  const addBtn = document.getElementById(addBtnId);

  function render(){
    container.querySelectorAll('.link-row').forEach(r=>r.remove());
    links.forEach((l, idx)=>{
      const row = document.createElement('div');
      row.className = 'link-row';
      row.innerHTML = `
        <input type="text" class="link-label-input" placeholder="ラベル(例: 公式サイト)" value="${escapeHtml(l.label)}" data-idx="${idx}" data-field="label">
        <input type="url" placeholder="https://..." value="${escapeHtml(l.url)}" data-idx="${idx}" data-field="url">
        <button type="button" class="link-remove" data-idx="${idx}">✕</button>
      `;
      container.insertBefore(row, addBtn);
    });
  }

  container.addEventListener('input', (e)=>{
    const field = e.target.dataset.field;
    if(!field) return;
    const idx = parseInt(e.target.dataset.idx);
    links[idx][field] = e.target.value;
  });
  container.addEventListener('click', (e)=>{
    const rm = e.target.closest('.link-remove');
    if(!rm) return;
    const idx = parseInt(rm.dataset.idx);
    links.splice(idx, 1);
    render();
  });
  addBtn.addEventListener('click', ()=>{
    links.push({label:'', url:''});
    render();
  });

  return {
    getLinks: ()=> links.filter(l=>l.url.trim()).map(l=>({label: l.label.trim() || 'リンク', url: normalizeUrl(l.url)})),
    reset: ()=>{ links = []; render(); },
    setLinks: (newLinks)=>{ links = (newLinks||[]).map(l=>({label:l.label||'', url:l.url||''})); render(); }
  };
}

/* ============================================================
   スキナモノ
============================================================ */
let items = [];
let currentFilter = 'すべて';
let currentSubFilter = 'すべて';
let searchTerm = '';
let editingId = null;
let sortKey = 'rating_desc';

const addLinkEditor = createLinkEditor('linkEditorAdd', 'linkAddBtnAdd');
let editLinkEditors = {}; // id -> linkEditor instance for inline edit forms

async function loadItems(){
  try{
    const res = await window.storage.get(FAV_KEY);
    items = res ? JSON.parse(res.value) : [];
  }catch(e){ items = []; }
  updateFilters();
  render();
}
async function saveItems(){
  try{ await window.storage.set(FAV_KEY, JSON.stringify(items)); }
  catch(e){ console.error('保存に失敗しました', e); }
}
function getCategories(){
  const cats = new Set();
  items.forEach(it=>{ if(it.category) cats.add(it.category); });
  return Array.from(cats);
}
function getSubCategories(cat){
  const subs = new Set();
  items.forEach(it=>{ if(it.category === cat && it.subCategory) subs.add(it.subCategory); });
  return Array.from(subs);
}

setupCombo('catInput','catArrow','catComboList', ()=>getCategories());
setupCombo('subCatInput','subCatArrow','subCatComboList', ()=>getSubCategories(document.getElementById('catInput').value.trim()));

function updateFilters(){
  const filtersEl = document.getElementById('filters');
  filtersEl.querySelectorAll('.chip:not([data-cat="すべて"])').forEach(c=>c.remove());
  getCategories().forEach(cat=>{
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.dataset.cat = cat;
    chip.textContent = cat;
    if(cat === currentFilter) chip.classList.add('active');
    filtersEl.appendChild(chip);
  });
  updateSubFilters();
}
function updateSubFilters(){
  const subEl = document.getElementById('subfilters');
  subEl.innerHTML = '';
  if(currentFilter === 'すべて'){ subEl.style.display = 'none'; currentSubFilter = 'すべて'; return; }
  const subs = getSubCategories(currentFilter);
  if(subs.length === 0){ subEl.style.display = 'none'; currentSubFilter = 'すべて'; return; }
  subEl.style.display = 'flex';
  const allChip = document.createElement('span');
  allChip.className = 'chip sub' + (currentSubFilter === 'すべて' ? ' active' : '');
  allChip.dataset.subcat = 'すべて';
  allChip.textContent = 'すべて';
  subEl.appendChild(allChip);
  subs.forEach(sc=>{
    const chip = document.createElement('span');
    chip.className = 'chip sub' + (sc === currentSubFilter ? ' active' : '');
    chip.dataset.subcat = sc;
    chip.textContent = sc;
    subEl.appendChild(chip);
  });
}

document.getElementById('filters').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#filters .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.cat;
  currentSubFilter = 'すべて';
  updateSubFilters();
  render();
});
document.getElementById('subfilters').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#subfilters .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentSubFilter = chip.dataset.subcat;
  render();
});
document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById('sortSelect').addEventListener('change', (e)=>{
  sortKey = e.target.value;
  render();
});
setupRatingFilter('ratingFilterBtn', 'ratingFilterList', ()=>{
  updateRatingFilterBtnState('ratingFilterBtn', 'ratingFilterList');
  render();
});

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const catInput = document.getElementById('catInput');
  const subCatInput = document.getElementById('subCatInput');
  const nameInput = document.getElementById('nameInput');
  const ratingInput = document.getElementById('ratingInput');
  const memoInput = document.getElementById('memoInput');

  const category = catInput.value.trim();
  const name = nameInput.value.trim();
  if(!category){ catInput.style.borderColor = '#C2542F'; return; }
  catInput.style.borderColor = '';
  if(!name){ nameInput.style.borderColor = '#C2542F'; nameInput.placeholder = '名前を入力してください'; return; }
  nameInput.style.borderColor = '';

  const newItem = {
    id: Date.now().toString(),
    category, subCategory: subCatInput.value.trim(), name,
    rating: parseInt(ratingInput.value),
    memo: memoInput.value.trim(),
    links: addLinkEditor.getLinks(),
    createdAt: Date.now()
  };
  items.push(newItem);
  await saveItems();
  nameInput.value = ''; memoInput.value = ''; ratingInput.value = '0';
  addLinkEditor.reset();
  updateFilters();
  render();
});

function render(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = '';

  const checkedRatings = getCheckedRatings('ratingFilterList');

  let filtered = items.filter(it=>{
    const matchCat = currentFilter === 'すべて' || it.category === currentFilter;
    const matchSub = currentSubFilter === 'すべて' || it.subCategory === currentSubFilter;
    const matchSearch = !searchTerm ||
      it.name.toLowerCase().includes(searchTerm) ||
      (it.memo && it.memo.toLowerCase().includes(searchTerm)) ||
      (it.subCategory && it.subCategory.toLowerCase().includes(searchTerm));
    const matchRating = checkedRatings.includes(it.rating || 0);
    return matchCat && matchSub && matchSearch && matchRating;
  });

  filtered = sortItems(filtered, sortKey);

  document.getElementById('countLabel').textContent = items.length + '件';

  if(filtered.length === 0){ empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  filtered.forEach(it=>{
    const el = document.createElement('div');
    el.className = 'item';

    if(editingId === it.id){
      el.innerHTML = renderEditForm(it);
      grid.appendChild(el);
      const editor = createLinkEditor('linkEditor_' + it.id, 'linkAddBtn_' + it.id);
      editor.setLinks(it.links);
      editLinkEditors[it.id] = editor;
      return;
    }

    const stars = it.rating > 0 ? '<span class="stars">' + '★'.repeat(it.rating) + '</span>' : '';
    const subBadge = it.subCategory ? `<span class="badge sub">${escapeHtml(it.subCategory)}</span>` : '';
    const dateStr = it.createdAt ? formatDate(it.createdAt) : '';
    el.innerHTML = `
      <div class="cat-badges">
        <span class="badge">${escapeHtml(it.category)}</span>
        ${subBadge}
      </div>
      <div class="body">
        <div class="top-row">
          <span class="title">${escapeHtml(it.name)}</span>
          ${stars}
        </div>
        ${it.memo ? `<div class="memo">${escapeHtml(it.memo)}</div>` : ''}
        ${renderLinkChips(it.links)}
      </div>
      <div class="actions">
        <div class="actions-top">
          <button class="btn-ghost" data-id="${it.id}" data-action="edit">編集</button>
        </div>
        <div class="actions-bottom">
          ${dateStr ? `<span class="date-label">${dateStr}</span>` : ''}
          <button class="btn-ghost" data-id="${it.id}" data-action="delete">削除</button>
        </div>
      </div>
    `;
    grid.appendChild(el);
  });
}

function renderEditForm(it){
  const ratingOptions = [0,1,2,3,4,5].map(n=>
    `<option value="${n}" ${it.rating===n?'selected':''}>${n===0?'評価なし':'★'.repeat(n)}</option>`
  ).join('');
  return `
    <div class="edit-form">
      <div class="edit-row">
        <input type="text" class="edit-cat" value="${escapeHtml(it.category)}" placeholder="大カテゴリ">
        <input type="text" class="edit-subcat" value="${escapeHtml(it.subCategory||'')}" placeholder="中カテゴリ(任意)">
      </div>
      <div class="edit-row">
        <input type="text" class="edit-name" value="${escapeHtml(it.name)}" placeholder="名前" style="flex:2;">
        <select class="edit-rating">${ratingOptions}</select>
      </div>
      <div class="edit-row">
        <textarea class="edit-memo" placeholder="メモ">${escapeHtml(it.memo||'')}</textarea>
      </div>
      <div class="edit-row">
        <div class="link-editor" id="linkEditor_${it.id}">
          <button class="link-add-btn" id="linkAddBtn_${it.id}" type="button">+ リンクを追加</button>
        </div>
      </div>
      <div class="edit-actions">
        <button class="btn-cancel" data-id="${it.id}" data-action="cancel">キャンセル</button>
        <button class="btn-save" data-id="${it.id}" data-action="save">保存</button>
      </div>
    </div>
  `;
}

document.getElementById('grid').addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;

  if(action === 'delete'){
    items = items.filter(it=>it.id !== id);
    await saveItems();
    updateFilters();
    render();
  }else if(action === 'edit'){
    editingId = id;
    render();
  }else if(action === 'cancel'){
    editingId = null;
    delete editLinkEditors[id];
    render();
  }else if(action === 'save'){
    const itemEl = btn.closest('.item');
    const category = itemEl.querySelector('.edit-cat').value.trim();
    const name = itemEl.querySelector('.edit-name').value.trim();
    if(!category || !name) return;
    const subCategory = itemEl.querySelector('.edit-subcat').value.trim();
    const rating = parseInt(itemEl.querySelector('.edit-rating').value);
    const memo = itemEl.querySelector('.edit-memo').value.trim();
    const links = editLinkEditors[id] ? editLinkEditors[id].getLinks() : [];

    const idx = items.findIndex(it=>it.id === id);
    if(idx !== -1){
      items[idx] = { ...items[idx], category, subCategory, name, rating, memo, links };
      await saveItems();
    }
    editingId = null;
    delete editLinkEditors[id];
    updateFilters();
    render();
  }
});

/* ============================================================
   キニナルモノ
============================================================ */

document.getElementById('curAddBtn').addEventListener('click', async ()=>{

  nameInput.value = ''; memoInput.value = ''; ratingInput.value = '0';
  curAddLinkEditor.reset();
  updateCurFilters();
  renderCur();
});

function renderCur(){
  const grid = document.getElementById('curGrid');
  const empty = document.getElementById('curEmptyState');
  grid.innerHTML = '';

  const checkedRatings = getCheckedRatings('curRatingFilterList');

  let filtered = curItems.filter(it=>{
    const matchCat = curFilter === 'すべて' || it.category === curFilter;
    const matchSearch = !curSearchTerm ||
      it.name.toLowerCase().includes(curSearchTerm) ||
      (it.memo && it.memo.toLowerCase().includes(curSearchTerm));
    const matchRating = checkedRatings.includes(it.rating || 0);
    return matchCat && matchSearch && matchRating;
  });

  filtered = sortItems(filtered, curSortKey);

  if(filtered.length === 0){ empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  filtered.forEach(it=>{
    const el = document.createElement('div');
    el.className = 'item';

    if(curEditingId === it.id){
      el.innerHTML = renderCurEditForm(it);
      grid.appendChild(el);
      const editor = createLinkEditor('curLinkEditor_' + it.id, 'curLinkAddBtn_' + it.id);
      editor.setLinks(it.links);
      curEditLinkEditors[it.id] = editor;
      return;
    }

    const stars = it.rating > 0 ? '<span class="stars">' + '★'.repeat(it.rating) + '</span>' : '';
    const dateStr = it.createdAt ? formatDate(it.createdAt) : '';
    el.innerHTML = `
      <div class="cat-badges">
        <span class="badge">${escapeHtml(it.category)}</span>
      </div>
      <div class="body">
        <div class="top-row">
          <span class="title">${escapeHtml(it.name)}</span>
          ${stars}
        </div>
        ${it.memo ? `<div class="memo">${escapeHtml(it.memo)}</div>` : ''}
        ${renderLinkChips(it.links)}
      </div>
      <div class="actions">
        <div class="actions-top">
          <button class="btn-promote" data-id="${it.id}" data-action="promote">スキナモノへ</button>
          <button class="btn-ghost" data-id="${it.id}" data-action="edit">編集</button>
        </div>
        <div class="actions-bottom">
          ${dateStr ? `<span class="date-label">${dateStr}</span>` : ''}
          <button class="btn-ghost" data-id="${it.id}" data-action="delete">削除</button>
        </div>
      </div>
    `;
    grid.appendChild(el);
  });
}

function renderCurEditForm(it){
  const ratingOptions = [0,1,2,3,4,5].map(n=>
    `<option value="${n}" ${it.rating===n?'selected':''}>${n===0?'関心度なし':'★'.repeat(n)}</option>`
  ).join('');
  return `
    <div class="edit-form">
      <div class="edit-row">
        <input type="text" class="edit-cat" value="${escapeHtml(it.category)}" placeholder="カテゴリ">
        <input type="text" class="edit-name" value="${escapeHtml(it.name)}" placeholder="名前" style="flex:2;">
        <select class="edit-rating">${ratingOptions}</select>
      </div>
      <div class="edit-row">
        <textarea class="edit-memo" placeholder="メモ">${escapeHtml(it.memo||'')}</textarea>
      </div>
      <div class="edit-row">
        <div class="link-editor" id="curLinkEditor_${it.id}">
          <button class="link-add-btn" id="curLinkAddBtn_${it.id}" type="button">+ リンクを追加</button>
        </div>
      </div>
      <div class="edit-actions">
        <button class="btn-cancel" data-id="${it.id}" data-action="cancel">キャンセル</button>
        <button class="btn-save" data-id="${it.id}" data-action="save">保存</button>
      </div>
    </div>
  `;
}

document.getElementById('curGrid').addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;

  if(action === 'delete'){
    curItems = curItems.filter(it=>it.id !== id);
    await saveCurItems();
    updateCurFilters();
    renderCur();
  }else if(action === 'edit'){
    curEditingId = id;
    renderCur();
  }else if(action === 'cancel'){
    curEditingId = null;
    delete curEditLinkEditors[id];
    renderCur();
  }else if(action === 'save'){
    const itemEl = btn.closest('.item');
    const category = itemEl.querySelector('.edit-cat').value.trim();
    const name = itemEl.querySelector('.edit-name').value.trim();
    if(!category || !name) return;
    const rating = parseInt(itemEl.querySelector('.edit-rating').value);
    const memo = itemEl.querySelector('.edit-memo').value.trim();
    const links = curEditLinkEditors[id] ? curEditLinkEditors[id].getLinks() : [];

    const idx = curItems.findIndex(it=>it.id === id);
    if(idx !== -1){
      curItems[idx] = { ...curItems[idx], category, name, rating, memo, links };
      await saveCurItems();
    }
    curEditingId = null;
    delete curEditLinkEditors[id];
    updateCurFilters();
    renderCur();
  }else if(action === 'promote'){
    const idx = curItems.findIndex(it=>it.id === id);
    if(idx === -1) return;
    const cur = curItems[idx];
    // 関心度の星は引き継がず、評価なしで追加する
    const promoted = {
      id: Date.now().toString(),
      category: cur.category,
      subCategory: '',
      name: cur.name,
      rating: 0,
      memo: cur.memo,
      links: cur.links || [],
      createdAt: Date.now()
    };
    items.push(promoted);
    await saveItems();
    curItems.splice(idx, 1);
    await saveCurItems();
    updateFilters();
    render();
    updateCurFilters();
    renderCur();
  }
});

/* ---------- 初期化(ログイン後に呼ばれる) ---------- */
window.__onLogin = async function(user){
  currentUid = user.uid;
  userDocCache = null;
  await ensureUserDoc();
  await loadTheme();
  await loadItems();
  await loadCurItems();
};
</script>
